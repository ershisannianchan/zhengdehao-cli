# 品牌叙事三章（蒸/鲜/味）
story:
  蒸: |
    2015年，一个做了15年海鲜的师傅在蛇口开了家店。
    他只定了一条规则：蒸。

    不是因为他不会炒、不会炸、不会焗。
    是因为他全试过了。

    煎会让虾肉收紧，炸会破坏鱼皮，烤会带走水分，
    焗的酱汁把蟹的甜味盖得一丝不剩。

    最后他发现：
    什么都不加，蒸汽均匀包裹90秒——
    那条东星斑自己会说话。

    "最好的代码是最短的那行。
     最好的做法是什么都不做。"

    他决定只做一件事。然后做了11年。
  鲜: |
    每天早上5:40，蛇口渔港的船靠岸。
    6:00，师傅已经在码头挑货。
    8:00，海鲜进店，入缸，还在动。
    10:00，你坐下来，它们还在动。

    这个链路跑了4000多天，没断过。

    为什么不开分店？
    "分店能保证渔港直采吗？
     不能的话，就是在代码里写hardcode。
     我拒绝。"

    蛇口渔港 → 万融大厦 = 4.2公里。
    "比你的CDN到用户还近。"
  味: |
    海鲜自己有味。
    蒜蓉是辅助，酱油是可选参数，辣椒是第三方插件。
    核心逻辑只有一条：蒸。

    蒸汽温度恒定102°C，锁住92%的游离氨基酸。
    数据来自深圳质检院的检测报告。
    （对，我们真测过。不信你来看报告。）

    你吃到的每一口，
    是蛇口的盐度、渔港的潮汐、和那个师傅11年前的决定。

    点评4.8分。
    11年。
    0食品安全事故。

    没有bug。

# 金句轮播池（每次启动随机一句）
quotes:
  - zh: 蒸的好，不调味。
    en: Steam is the sauce.
  - zh: 你debug了半天发现bug是自己。我们试了所有做法，发现最好的调料是——什么都不放。
    en: The best seasoning is no seasoning.
  - zh: 就像不在PR里加无关代码。我们不在海鲜上刷厚酱。
    en: No dead code. No heavy sauce.
  - zh: 最简单的方案往往是最优解。蒸 = O(1)。
    en: Steaming is O(1).
  - zh: 蛇口渔港 → 餐桌 = 4小时。比你的CI pipeline还快。
    en: 4 hours from pier to plate.
  - zh: 点评4.8分，11年，0食品安全事故。这个uptime你服不服。
    en: 11 years uptime. Zero incidents.
  - zh: 为什么只蒸？和为什么只用vim是一个道理。
    en: Why steam only? Same reason you use vim.
  - zh: 复杂调味 = 技术债。蒸汽锁鲜 = 纯函数。
    en: Heavy seasoning is tech debt. Steam is a pure function.

